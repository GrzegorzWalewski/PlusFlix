[package]
name = "plusflix-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
plusflix-core = { version = "1.1.0", path = "../plusflix-core" }
slint = "1.19.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
webbrowser = "1"

[build-dependencies]
slint-build = "1.19.0"

[target.'cfg(target_family = "windows")'.build-dependencies]
winresource = "0.1.28"

[dev-dependencies]
i-slint-backend-testing = "1.19.0"
i-slint-core = "1.19.0"
